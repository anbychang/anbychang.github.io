<p>給定兩個整數序列 <code>S1</code> 與 <code>S2</code>。從兩者各選出一個等長子序列，要求對應位置的數字差的絕對值都不超過 1。</p>
<p>先讓子序列長度最大；若有多個最長解，輸出字典序最大的 <code>S1'</code>。</p>
<h3>輸入</h3><p>兩行，每行一個以空格分隔的整數序列。兩序列長度各為 1 到 1500，元素介於 0 到 9。</p>
<h3>輸出</h3><p>一行 <code>S1'</code>，數字以空格分隔。若沒有任何可配對元素，輸出空行。</p>
<div class="sample-grid"><div><span>範例輸入</span><pre>2 5 7 9 4 1 3
3 5 4 5 7 3</pre></div><div><span>範例輸出</span><pre>2 5 7 4</pre></div></div>
