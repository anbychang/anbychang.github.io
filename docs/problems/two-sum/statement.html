<p>給定一個整數陣列與目標值，找出兩個不同位置，使它們的數字相加等於目標值。</p>
<h3>輸入</h3><p>第一行為 <code>n target</code>，第二行為 <code>n</code> 個整數。保證至少存在一組解。<code>2 ≤ n ≤ 2000</code>，每個數字介於 -10<sup>9</sup> 到 10<sup>9</sup>。</p>
<h3>輸出</h3><p>任意一組符合條件的 <strong>1-based</strong> 索引 <code>i j</code>，其中 <code>i &lt; j</code>。</p>
<div class="sample-grid"><div><span>範例輸入</span><pre>4 9
2 7 11 15</pre></div><div><span>範例輸出</span><pre>1 2</pre></div></div>
