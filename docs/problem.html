<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f9">
  <title>Anby's Judge</title>
  <meta name="description" content="C++20 practice problems and online judging.">
  <link rel="stylesheet" href="./style.css?v=statement-2">
  <script type="module" src="./app.js?v=layout-5"></script>
</head>
<body class="problem-page">
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Back to problems"><span class="brand-mark">AJ</span><span>Anby's Judge</span></a>
    <a class="header-action" href="#editor-title">Code</a>
  </header>

  <main>
    <div class="workspace">
      <div class="main-column">
        <section class="panel statement-panel" aria-labelledby="problem-title">
          <div class="panel-heading"><h1 id="problem-title">Loading...</h1></div>
          <div id="statement" class="statement"></div>
        </section>

        <section class="panel editor-panel" aria-labelledby="editor-title">
          <div class="panel-heading"><h2 id="editor-title">Code</h2><span class="language-tag">C++20</span></div>
          <label for="source-code" class="sr-only">C++ code</label>
          <textarea id="source-code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">#include &lt;bits/stdc++.h&gt;
using namespace std;

int main() {
    
}</textarea>
          <div class="editor-actions">
            <div class="button-row"><button id="stop-button" type="button" class="button-secondary" hidden>Stop</button><button id="run-button" type="button" class="button-primary">Submit</button></div>
          </div>
          <div id="run-progress" class="run-progress" aria-label="Judging progress" hidden>
            <div class="progress-head"><strong id="progress-label">Preparing</strong><span id="progress-count">0 / 0</span></div>
            <div id="progress-track" class="progress-track" role="progressbar" aria-label="Completed test cases" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><div id="progress-fill" class="progress-fill"></div></div>
            <div class="progress-foot"><span id="progress-stage">Starting judge</span><span id="progress-elapsed">00:00</span></div>
          </div>
        </section>

        <section class="panel result-panel" aria-labelledby="result-title">
          <div class="panel-heading"><h2 id="result-title">Result</h2><span id="verdict" class="verdict neutral">Not submitted</span></div>
          <p id="status" class="status" role="status" aria-live="polite">Submit code to see the result.</p>
          <pre id="detail" class="detail" hidden></pre>
        </section>
      </div>
    </div>
  </main>

  <footer>Practice judge · Code is not saved. Copy it before leaving this page.</footer>
</body>
</html>
